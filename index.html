<!doctype html>
<html lang="zh-Hant" data-look="1"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="手把">
<link rel="apple-touch-icon" href="/icon.png">
<title>手機手把</title>
<style>
  /* Tokens. Backgrounds and lines are pure grey; the player colour (--c) is the one accent. */
  :root {
    --c: #ff3c28;
    --bg: #f0f0f0; --panel: #e2e2e2; --key: #fafafa; --edge: #c4c4c4; --deep: #a8a8a8;
    --ink: #1c1c1c; --dim: #6e6e6e; --well: #d4d4d4; --knob: #ffffff;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0e0e0e; --panel: #1b1b1b; --key: #2c2c2c; --edge: #3e3e3e; --deep: #000000;
    --ink: #f2f2f2; --dim: #8e8e8e; --well: #141414; --knob: #4a4a4a;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e0e0e; --panel: #1b1b1b; --key: #2c2c2c; --edge: #3e3e3e; --deep: #000000;
      --ink: #f2f2f2; --dim: #8e8e8e; --well: #141414; --knob: #4a4a4a;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; margin: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg); color: var(--ink); font: 600 16px -apple-system, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
  body { position: fixed; inset: 0; }
  svg { display: block; fill: currentColor; }

  main { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr auto 1fr; gap: 2vmin;
         padding: max(3vmin, env(safe-area-inset-top)) max(3vmin, env(safe-area-inset-right)) max(3vmin, env(safe-area-inset-bottom)) max(3vmin, env(safe-area-inset-left)); }
  .side { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 3vmin; }
  .mid { display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 1.5vmin; padding: 1vmin 0; }

  /* Every key reaches a little past its edge, so a slightly-off thumb still lands. */
  .key { position: relative; display: grid; place-items: center; color: var(--ink); background: var(--key); transition: transform .05s; }
  .key::after { content: ""; position: absolute; inset: -1.6vmin; }
  .key.down { background: var(--c); color: #000; transform: translateY(0.5vmin); }

  .shoulders { display: flex; gap: 2vmin; width: 100%; }
  .right .shoulders { flex-direction: row-reverse; }
  .sh { flex: 1; height: 11vmin; border-radius: 3vmin; font-size: 4.5vmin; }

  .zone { flex: 1; width: 100%; display: grid; place-items: center; }  /* floating stick: touch anywhere here */
  .stick { position: relative; width: 36vmin; height: 36vmin; border-radius: 50%; background: var(--well); flex: none; }
  .stick.small { width: 30vmin; height: 30vmin; }
  .stick i { position: absolute; left: 30%; top: 30%; width: 40%; height: 40%; border-radius: 50%; background: var(--knob); pointer-events: none; transition: transform .08s; }
  .stick.active i { transition: none; background: var(--c); }

  .cross { position: relative; width: 33vmin; height: 33vmin; flex: none; }
  .cross .key { position: absolute; width: 11vmin; height: 11vmin; }
  .cross [data-p="n"] { left: 11vmin; top: 0; }
  .cross [data-p="w"] { left: 0; top: 11vmin; }
  .cross [data-p="e"] { right: 0; top: 11vmin; }
  .cross [data-p="s"] { left: 11vmin; bottom: 0; }
  .dpad .key { border-radius: 2.5vmin; color: var(--dim); }
  .dpad .key::after { inset: -1vmin; }
  .dpad svg { width: 3.6vmin; height: 3.6vmin; }
  .dpad [data-p="w"] svg { transform: rotate(-90deg); } .dpad [data-p="e"] svg { transform: rotate(90deg); } .dpad [data-p="s"] svg { transform: rotate(180deg); }
  .abxy { width: 39vmin; height: 39vmin; }
  .abxy .key { width: 13vmin; height: 13vmin; border-radius: 50%; font-size: 6vmin; }
  .abxy [data-p="n"] { left: 13vmin; } .abxy [data-p="w"], .abxy [data-p="e"] { top: 13vmin; } .abxy [data-p="s"] { left: 13vmin; }

  .row { display: flex; gap: 2.4vmin; }
  .sm { width: max(10vmin, 44px); height: max(10vmin, 44px); border-radius: 50%; font-size: 6vmin; }
  .sm.st { font-size: 3.6vmin; }
  .players { display: grid; grid-template-columns: 1fr 1fr; gap: 1.6vmin; }
  .pl, .tool { border: 0; font: inherit; color: var(--dim); background: var(--key); }
  .pl { width: max(13vmin, 52px); height: max(8vmin, 44px); border-radius: 999px; font-size: max(4vmin, 15px); }
  .pl.on { background: var(--pc); color: #000; }
  .tool { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; }
  .tool svg { width: 18px; height: 18px; }
  .tool.on { color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }

  /* Look 1: the original design, its own dark palette whatever the theme */
  html:root[data-look="1"] { --bg: #0d0d10; --panel: #1b1b21; --key: #2a2a33; --edge: #3a3a46; --deep: #000; --ink: #f2f2f5; --dim: #8a8a96; color-scheme: dark; }
  [data-look="1"] .side { border-radius: 6vmin; background: var(--panel); box-shadow: inset 0 0 0 1px var(--edge); }
  [data-look="1"] .side::before { content: ""; position: absolute; top: 0; width: 40%; height: 1.2vmin; border-radius: 0 0 1vmin 1vmin; background: var(--c); }
  [data-look="1"] .key, [data-look="1"] .pl { box-shadow: inset 0 0 0 1px var(--edge), 0 0.6vmin 0 #000; }
  [data-look="1"] .key.down, [data-look="1"] .pl.on { box-shadow: none; }
  [data-look="1"] .stick { background: radial-gradient(circle, #15151a 55%, #202027); box-shadow: inset 0 0 0 1px var(--edge); }
  [data-look="1"] .stick i { background: radial-gradient(circle at 40% 35%, #4a4a56, #2a2a33); box-shadow: 0 1vmin 2vmin #000a; }
  [data-look="1"] .stick.active i { background: radial-gradient(circle at 40% 35%, var(--c), #000 140%); }

  /* Look 2: two Joy-Con halves, grey panels with a player-colour strip */
  [data-look="2"] .side { border-radius: 6vmin; background: var(--panel); box-shadow: inset 0 0 0 1px var(--edge); }
  [data-look="2"] .side::before { content: ""; position: absolute; top: 0; width: 40%; height: 1.2vmin; border-radius: 0 0 1vmin 1vmin; background: var(--c); }
  [data-look="2"] .key, [data-look="2"] .pl { box-shadow: inset 0 0 0 1px var(--edge), 0 0.6vmin 0 var(--deep); }
  [data-look="2"] .key.down { box-shadow: none; }

  /* Look 3: minimal touch overlay, outlines only, no panels */
  [data-look="3"] .key, [data-look="3"] .pl { background: transparent; box-shadow: inset 0 0 0 0.45vmin var(--dim); }
  [data-look="3"] .key.down { background: var(--c); box-shadow: none; }
  [data-look="3"] .pl.on { background: var(--pc); box-shadow: none; }
  [data-look="3"] .stick { background: transparent; box-shadow: inset 0 0 0 0.45vmin var(--dim); }
  [data-look="3"] .stick i { background: var(--dim); }
  [data-look="3"] .stick.active i { background: var(--c); }

  /* Look 4: one controller body with grips, keys raised out of it */
  [data-look="4"] main { margin: 2vmin; border-radius: 12vmin 12vmin 30vmin 30vmin; background: var(--panel); box-shadow: inset 0 0 0 1px var(--edge), 0 2vmin 6vmin #0000004d; }
  [data-look="4"] .key, [data-look="4"] .pl { background: linear-gradient(var(--key), var(--well)); box-shadow: inset 0 0.3vmin 0 #ffffff26, 0 0.9vmin 0 var(--deep), 0 1.2vmin 2vmin #00000040; }
  [data-look="4"] .pl.on { background: var(--pc); }
  [data-look="4"] .key.down { background: var(--c); box-shadow: 0 0.3vmin 0 var(--deep); transform: translateY(0.7vmin); }
  [data-look="4"] .stick { box-shadow: inset 0 1vmin 2vmin #00000059; }
  [data-look="4"] .stick i { box-shadow: 0 1vmin 2vmin #00000066; }
  [data-look="4"] .side::before { content: ""; position: absolute; top: 2vmin; width: 3vmin; height: 3vmin; border-radius: 50%; background: var(--c); }

  #rot { display: none; position: fixed; inset: 0; z-index: 9; background: var(--bg); place-items: center; text-align: center; color: var(--dim); font-size: 18px; line-height: 1.8; }
  #rot svg { width: 48px; height: 48px; margin: 0 auto 8px; fill: none; stroke: var(--ink); stroke-width: 2; }
  @media (orientation: portrait) { #rot { display: grid; } }
  @media (prefers-reduced-motion: reduce) { .key, .stick i { transition: none; } }
</style></head><body>
<div id="rot"><div><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M8 3l-2 2 2 2"/></svg>請把手機轉成橫的</div></div>
<main>
  <section class="side left">
    <div class="shoulders"><div class="key sh" data-b="zl">ZL</div><div class="key sh" data-b="l">L</div></div>
    <div class="zone" data-s="l"><div class="stick"><i></i></div></div>
    <div class="cross dpad">
      <div class="key" data-p="n" data-b="dup"><svg viewBox="0 0 10 10"><path d="M5 1.5 9 8H1z"/></svg></div>
      <div class="key" data-p="w" data-b="dleft"><svg viewBox="0 0 10 10"><path d="M5 1.5 9 8H1z"/></svg></div>
      <div class="key" data-p="e" data-b="dright"><svg viewBox="0 0 10 10"><path d="M5 1.5 9 8H1z"/></svg></div>
      <div class="key" data-p="s" data-b="ddown"><svg viewBox="0 0 10 10"><path d="M5 1.5 9 8H1z"/></svg></div>
    </div>
  </section>
  <section class="mid">
    <button class="tool" id="theme" aria-label="切換淺色或深色"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18V3z"/><path d="M12 3a9 9 0 0 1 0 18" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
    <div class="row"><div class="key sm" data-b="minus">−</div><div class="key sm" data-b="plus">+</div></div>
    <div class="row"><div class="key sm st" data-b="l3">L3</div><div class="key sm st" data-b="r3">R3</div></div>
    <div class="players" id="players"></div>
    <button class="tool" id="look" aria-label="換外觀"></button>
  </section>
  <section class="side right">
    <div class="shoulders"><div class="key sh" data-b="zr">ZR</div><div class="key sh" data-b="r">R</div></div>
    <div class="cross abxy">
      <div class="key" data-p="n" data-b="x">X</div><div class="key" data-p="w" data-b="y">Y</div>
      <div class="key" data-p="e" data-b="a">A</div><div class="key" data-p="s" data-b="b">B</div>
    </div>
    <div class="stick small" data-s="r"><i></i></div>
  </section>
</main>
<script>
const T = new URLSearchParams(location.search).get("t");
// The manifest is token-gated like everything else, so it is linked here where the token is known.
document.head.append(Object.assign(document.createElement("link"), { rel: "manifest", href: `/manifest.json?t=${T}` }));
const COLORS = ["#ff3c28", "#0ab9e6", "#ffdc00", "#1edc00"];  // Joy-Con red, blue, yellow, green
// DSU button bits, laid out the way Eden maps them onto a Switch pad.
const BIT = { minus: 0x1, l3: 0x2, r3: 0x4, plus: 0x8, dup: 0x10, dright: 0x20, ddown: 0x40, dleft: 0x80, zl: 0x100, zr: 0x200,
              l: 0x400, r: 0x800, x: 0x1000, a: 0x2000, b: 0x4000, y: 0x8000 };
let P = +(localStorage.getItem("pad_p") || 1);
const st = { b: 0, lx: 0, ly: 0, rx: 0, ry: 0 };
const query = (p, s, n) => `/s?t=${T}&p=${p}&n=${n}&b=${s.b}&lx=${s.lx}&ly=${s.ly}&rx=${s.rx}&ry=${s.ry}`;

// Send the whole state, one request at a time, numbered: a late or lost request can never leave a button held.
let busy = false, dirty = false, n = 0;
const next = () => (n = Math.max(Date.now(), n + 1));
function push() {
  dirty = true;
  if (busy) return;
  busy = true; dirty = false;
  fetch(query(P, st, next())).catch(() => {}).finally(() => { busy = false; if (dirty) push(); });
}
setInterval(push, 1000);  // heartbeat: the server lets go of a pad that goes quiet for 3 s

const sticks = [];
function releaseAll() {
  Object.assign(st, { b: 0, lx: 0, ly: 0, rx: 0, ry: 0 });
  document.querySelectorAll(".down").forEach(e => e.classList.remove("down"));
  sticks.forEach(s => s.reset());
  fetch(query(P, st, next())).catch(() => {});
}

// Not "top" or other window.* names: redeclaring one throws and kills the whole script.
const players = document.getElementById("players");
[1, 2, 3, 4].forEach(k => {
  const btn = document.createElement("button");
  btn.className = "pl"; btn.textContent = "P" + k; btn.style.setProperty("--pc", COLORS[k - 1]);
  btn.onclick = () => { releaseAll(); P = k; localStorage.setItem("pad_p", k); paint(); push(); };
  players.appendChild(btn);
});
function paint() {
  [...players.children].forEach((b, i) => b.classList.toggle("on", i + 1 === P));
  document.documentElement.style.setProperty("--c", COLORS[P - 1]);
}
paint();

// Buttons: each pointer tracks its own button so several can be held at once.
document.querySelectorAll(".key[data-b]").forEach(el => {
  const bit = BIT[el.dataset.b];
  const down = e => { e.preventDefault(); el.setPointerCapture(e.pointerId); el.classList.add("down"); st.b |= bit; push(); navigator.vibrate?.(10); };
  const up = () => { if (!el.classList.contains("down")) return; el.classList.remove("down"); st.b &= ~bit; push(); };
  el.addEventListener("pointerdown", down);
  ["pointerup", "pointercancel", "lostpointercapture"].forEach(t => el.addEventListener(t, up));
});

// Sticks: real analog, -127..127 with up positive. A stick inside a .zone floats: it re-centres
// wherever the thumb lands in the zone, so the thumb never has to find the stick first.
document.querySelectorAll("[data-s]").forEach(area => {
  const side = area.dataset.s, stick = area.classList.contains("stick") ? area : area.querySelector(".stick");
  const knob = stick.firstElementChild, floating = stick !== area;
  let sid = null, ox = 0, oy = 0;  // centre the stick is measured from
  const set = (x, y) => {
    const ax = Math.round(x * 127), ay = Math.round(-y * 127);
    if (st[side + "x"] === ax && st[side + "y"] === ay) return;
    st[side + "x"] = ax; st[side + "y"] = ay; push();
  };
  const move = e => {
    const reach = stick.offsetWidth / 2 * 0.6;
    let dx = e.clientX - ox, dy = e.clientY - oy;
    const len = Math.hypot(dx, dy);
    if (len > reach) { dx *= reach / len; dy *= reach / len; }
    knob.style.transform = `translate(${dx}px,${dy}px)`;
    const dead = len < reach * 0.12;
    set(dead ? 0 : dx / reach, dead ? 0 : dy / reach);
  };
  const reset = () => { sid = null; knob.style.transform = stick.style.transform = ""; stick.classList.remove("active"); };
  area.addEventListener("pointerdown", e => {
    e.preventDefault(); sid = e.pointerId; area.setPointerCapture(sid); stick.classList.add("active");
    stick.style.transform = "";
    const r = stick.getBoundingClientRect();
    [ox, oy] = floating ? [e.clientX, e.clientY] : [r.left + r.width / 2, r.top + r.height / 2];
    if (floating) stick.style.transform = `translate(${ox - r.left - r.width / 2}px,${oy - r.top - r.height / 2}px)`;
    move(e);
  });
  area.addEventListener("pointermove", e => e.pointerId === sid && move(e));
  ["pointerup", "pointercancel"].forEach(t => area.addEventListener(t, e => { if (e.pointerId === sid) { reset(); set(0, 0); } }));
  sticks.push({ reset });
});

// iOS Safari ignores user-scalable=no: block pinch, double-tap zoom and page scrolling ourselves.
["gesturestart", "gesturechange", "gestureend", "dblclick"].forEach(t => document.addEventListener(t, e => e.preventDefault()));
document.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
let lastTap = 0;
document.addEventListener("touchend", e => { const now = Date.now(); if (now - lastTap < 300) e.preventDefault(); lastTap = now; }, { passive: false });

// Never leave a button held when the phone locks or switches app.
document.addEventListener("visibilitychange", () => document.hidden && releaseAll());
addEventListener("pagehide", releaseAll);

// Light/dark: follow the system until the switch is used, then remember the choice.
const root = document.documentElement;
const store = (k, v) => { try { v === undefined ? (v = localStorage.getItem(k)) : localStorage.setItem(k, v); } catch {} return v; };
if (store("pad_theme")) root.dataset.theme = store("pad_theme");
document.getElementById("theme").onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark"; store("pad_theme", root.dataset.theme);
};

// Looks: 1 original, 2 Joy-Con panels, 3 minimal outlines, 4 one controller body. Tap to cycle; remembered.
const LOOKS = 4, lookBtn = document.getElementById("look");
const setLook = v => { root.dataset.look = v; lookBtn.textContent = v; store("pad_look", v); };
lookBtn.onclick = () => setLook(String(root.dataset.look % LOOKS + 1));
setLook(store("pad_look") || "1");
</script></body></html>
